name: Feature proposal
description: Explain a user problem and a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and scope
      description: Describe the smallest useful change and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How could a contributor verify the improvement? Note dependencies, telemetry or safety implications.
    validations:
      required: true
